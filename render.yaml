services:
  - type: web
    name: aeo-creations
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.production:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: MAGIC_HOUR_API_KEY
        sync: false
      - key: JSON2VIDEO_API_KEY
        sync: false
      - key: REWIND_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: PIXVERSE_API_KEY
        sync: false
      - key: KLING_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MODAL_TOKEN_ID
        sync: false
      - key: MODAL_TOKEN_SECRET
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_CURRENCY
        value: USD
      - key: PUBLIC_APP_URL
        sync: false
